<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Edit Staff</title>
</head>
<body>
<div align="center">
    <h1>Edit Staff</h1>
    <br/>
    <form action="#" th:action="@{/save}" th:object="${staff}" method="post">
        <table border="0" cellpadding="10" cellspacing="0">
            <tr><td>ID</td>    <td><input type="text" th:field="*{id}" readonly="readonly"/></td></tr>
            <tr><td>Name</td>  <td><input type="text" th:field="*{name}"/></td></tr>
            <tr><td>Age</td>   <td><input type="text" th:field="*{age}"/></td></tr>
            <tr><td>Email</td> <td><input type="text" th:field="*{email}"/></td></tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Save</button>
                </td>
            </tr>
        </table>
    </form>
</div>
</body>
</html>
